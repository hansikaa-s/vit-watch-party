<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Velvet Watch</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #121212;
      color: #FFFFFF;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-120px) scale(1.4); opacity: 0; }
    }
    .emoji-float {
      position: absolute;
      animation: floatUp 2s ease-out forwards;
      pointer-events: none;
    }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #121212; }
    ::-webkit-scrollbar-thumb { background: #282828; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #535353; }
  </style>
</head>

<body class="min-h-screen p-4 md:p-8 selection:bg-[#E50914] selection:text-white">
  <main class="max-w-6xl mx-auto">
    
    <!-- HEADER NAVBAR -->
    <header class="flex flex-col sm:flex-row items-center justify-between gap-4 mb-8 pb-4 border-b border-[#282828]">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-[#E50914] flex items-center justify-center text-white font-extrabold text-xl shadow-lg shadow-[#E50914]/25">
          ▶
        </div>
        <div>
          <h1 class="text-2xl font-extrabold tracking-tight text-white flex items-center gap-2">
            Velvet Watch <span class="text-[10px] bg-[#E50914]/10 text-[#E50914] border border-[#E50914]/30 px-2 py-0.5 rounded-full font-bold uppercase">Live Sync</span>
          </h1>
          <p class="text-xs text-[#B3B3B3]">Watch and chat together in real time.</p>
        </div>
      </div>

      <div class="flex items-center gap-2 w-full sm:w-auto">
        <button
          id="createRoomBtn"
          class="bg-[#E50914] hover:bg-[#ff0f1a] text-white px-6 py-2.5 rounded-full font-bold text-xs tracking-wider transition-all shadow-lg shadow-[#E50914]/25 hover:scale-105 active:scale-95 whitespace-nowrap"
        >
          Create Room
        </button>

        <div class="flex gap-2 flex-1 sm:flex-initial">
          <input
            id="roomCodeInput"
            type="text"
            placeholder="ROOM CODE"
            class="w-full sm:w-36 rounded-full bg-[#181818] border border-[#282828] focus:border-[#E50914] px-4 py-2.5 text-white placeholder-[#535353] uppercase tracking-widest font-extrabold text-xs focus:outline-none transition-all"
          />

          <button
            id="joinRoomBtn"
            class="bg-[#282828] hover:bg-[#3E3E3E] text-white px-5 py-2.5 rounded-full text-xs font-bold transition-all hover:scale-105 active:scale-95"
          >
            Join
          </button>
        </div>
      </div>
    </header>

    <p id="statusMessage" class="text-[#E50914] text-xs font-bold mb-6 text-center min-h-[16px]" aria-live="polite"></p>

    <!-- WATCH PARTY MAIN DASHBOARD GRID -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 text-left">
      
      <!-- LEFT 2 COLUMNS: VIDEO PLAYER & LIVE API DISCOVERY -->
      <div class="lg:col-span-2 space-y-5">
        
        <!-- URL INPUT BAR -->
        <div class="flex flex-col sm:flex-row gap-2 bg-[#181818] p-2 rounded-2xl border border-[#282828]">
          <input
            id="youtubeUrl"
            type="url"
            placeholder="Paste a YouTube video link..."
            class="flex-1 rounded-xl bg-[#121212] border border-transparent px-4 py-2 text-white placeholder-[#535353] focus:outline-none focus:border-[#E50914] text-xs transition-all"
          />
          <button
            id="loadVideoBtn"
            class="bg-[#E50914] hover:bg-[#ff0f1a] text-white px-5 py-2 rounded-xl font-bold text-xs transition-all hover:scale-105 active:scale-95"
          >
            Load Video
          </button>
        </div>

        <p id="videoMessage" class="text-[#B3B3B3] text-xs min-h-[16px] px-1"></p>

        <!-- VIDEO PLAYER CONTAINER -->
        <div class="relative aspect-video bg-black rounded-2xl overflow-hidden border border-[#282828] shadow-2xl shadow-red-950/20">
          <div id="youtubePlayer" class="w-full h-full"></div>
          <div id="emojiOverlay" class="absolute inset-0 pointer-events-none overflow-hidden"></div>
        </div>

        <!-- EMOJI REACTION BAR -->
        <div class="flex items-center justify-between bg-[#181818] px-5 py-3 rounded-2xl border border-[#282828]">
          <span class="text-[11px] text-[#B3B3B3] font-bold uppercase tracking-wider">Reactions</span>
          <div class="flex gap-4">
            <button class="reaction-btn text-xl hover:scale-130 transition-transform active:scale-90">❤️</button>
            <button class="reaction-btn text-xl hover:scale-130 transition-transform active:scale-90">🔥</button>
            <button class="reaction-btn text-xl hover:scale-130 transition-transform active:scale-90">😭</button>
            <button class="reaction-btn text-xl hover:scale-130 transition-transform active:scale-90">😮</button>
            <button class="reaction-btn text-xl hover:scale-130 transition-transform active:scale-90">💀</button>
          </div>
        </div>

        <!-- LIVE YOUTUBE API SEARCH DISCOVERY -->
        <div class="bg-[#181818] p-5 rounded-2xl border border-[#282828] space-y-4">
          <div class="flex items-center justify-between">
            <h3 class="text-xs font-bold text-white uppercase tracking-wider">🎬 Live Movie & Video Search</h3>
            <span class="text-[10px] text-[#E50914] font-bold bg-[#121212] px-3 py-1 rounded-full border border-[#E50914]/20">YouTube Data API v3</span>
          </div>
          
          <div class="flex gap-2">
            <input
              id="searchMovieInput"
              type="text"
              placeholder="Type any movie trailer, song, or video title..."
              class="flex-1 rounded-xl bg-[#121212] border border-[#282828] px-3.5 py-2 text-xs text-white placeholder-[#535353] focus:outline-none focus:border-[#E50914] transition-all"
            />
            <button
              id="apiSearchBtn"
              class="bg-[#E50914] hover:bg-[#ff0f1a] text-white px-4 py-2 rounded-xl text-xs font-bold transition-all"
            >
              Search
            </button>
          </div>

          <div id="movieGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-3 max-h-64 overflow-y-auto pr-1"></div>
        </div>

      </div>

      <!-- RIGHT 1 COLUMN: SIDEBAR CHAT -->
      <div class="bg-[#181818] p-4 rounded-2xl border border-[#282828] flex flex-col h-[580px]">
        <div class="flex items-center justify-between mb-3 pb-3 border-b border-[#282828]">
          <span class="text-xs font-bold text-white uppercase tracking-wider">💬 Room Chat</span>
          <span id="roleBadge" class="text-[10px] bg-[#121212] text-[#E50914] border border-[#E50914]/30 px-2.5 py-0.5 rounded-full font-bold">Viewer</span>
        </div>

        <div class="mb-3">
          <input
            id="usernameInput"
            type="text"
            placeholder="Your display name..."
            class="w-full rounded-xl bg-[#121212] border border-[#282828] focus:border-[#E50914] px-3 py-1.5 text-xs text-white placeholder-[#535353] focus:outline-none transition-all font-semibold"
          />
        </div>

        <div id="chatMessages" class="flex-1 overflow-y-auto space-y-2.5 text-xs pr-1 mb-3">
          <p class="text-[#535353] italic text-center py-6">Connected to the room. Send a message!</p>
        </div>

        <div class="flex gap-2 pt-3 border-t border-[#282828]">
          <input
            id="chatInput"
            type="text"
            placeholder="Type a message..."
            class="flex-1 rounded-xl bg-[#121212] border border-[#282828] px-3 py-2 text-xs text-white placeholder-[#535353] focus:outline-none focus:border-[#E50914] transition-all"
          />
          <button
            id="sendChatBtn"
            class="bg-[#E50914] hover:bg-[#ff0f1a] text-white px-4 py-2 rounded-xl text-xs font-bold transition-all hover:scale-105 active:scale-95"
          >
            Send
          </button>
        </div>
      </div>

    </div>

    <!-- FOOTER STATUS -->
    <footer class="mt-8 rounded-2xl border border-[#282828] bg-[#181818] p-4 text-center">
      <p class="text-[#E50914] text-xs font-bold tracking-widest uppercase">
        ✓ Real-Time Sync Engine Active (&le;500ms Drift Auto-Correction)
      </p>
    </footer>

  </main>

  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    const socket = io();

    // Paste your YouTube Data API v3 key here
    const YOUTUBE_API_KEY = "AIzaSyBireHsybkea2yTTWf4Z9TKQto0NwP23Vk";

    let player;
    let isHost = false;
    let currentRoom = "";
    let isRemoteAction = false;

    const createBtn = document.getElementById("createRoomBtn");
    const joinBtn = document.getElementById("joinRoomBtn");
    const roomInput = document.getElementById("roomCodeInput");
    const status = document.getElementById("statusMessage");
    const youtubeUrl = document.getElementById("youtubeUrl");
    const loadVideoBtn = document.getElementById("loadVideoBtn");
    const videoMessage = document.getElementById("videoMessage");
    const roleBadge = document.getElementById("roleBadge");
    const usernameInput = document.getElementById("usernameInput");

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('youtubePlayer', {
        videoId: 'M7lc1UVf-VE',
        playerVars: { 'playsinline': 1, 'controls': 1, 'modestbranding': 1 },
        events: { 'onStateChange': onPlayerStateChange }
      });
    }

    function onPlayerStateChange(event) {
      if (isRemoteAction || !currentRoom) return;
      const currentTime = player.getCurrentTime();
      if (event.data === YT.PlayerState.PLAYING) {
        socket.emit("sync_action", { room: currentRoom, action: "play", time: currentTime });
      } else if (event.data === YT.PlayerState.PAUSED) {
        socket.emit("sync_action", { room: currentRoom, action: "pause", time: currentTime });
      }
    }

    createBtn.addEventListener("click", () => { socket.emit("create_room"); });

    joinBtn.addEventListener("click", () => {
      const code = roomInput.value.trim().toUpperCase();
      if (!code) { status.textContent = "Please enter a room code."; return; }
      socket.emit("join_room", { room: code });
    });

    socket.on("room_created", (data) => {
      currentRoom = data.room; isHost = true; roomInput.value = data.room;
      roleBadge.textContent = "Host"; status.textContent = "Room created! Share code: " + data.room;
    });

    socket.on("room_joined", (data) => {
      currentRoom = data.room; isHost = data.is_host;
      roleBadge.textContent = isHost ? "Host" : "Viewer"; status.textContent = "You joined room: " + data.room;
      if (data.video_id && player && player.loadVideoById) {
        isRemoteAction = true;
        player.loadVideoById(data.video_id, data.current_time || 0);
        if (!data.is_playing) player.pauseVideo();
        setTimeout(() => { isRemoteAction = false; }, 1000);
      }
    });

    socket.on("room_error", (data) => { status.textContent = data.message; });

    socket.on("video_changed", (data) => {
      if (player && player.loadVideoById) {
        isRemoteAction = true;
        player.loadVideoById(data.video_id);
        videoMessage.textContent = "The room's video has been updated!";
        setTimeout(() => { isRemoteAction = false; }, 1000);
      }
    });

    socket.on("sync_action", (data) => {
      if (!player) return;
      isRemoteAction = true;
      if (data.action === "play") { player.seekTo(data.time, true); player.playVideo(); }
      else if (data.action === "pause") { player.seekTo(data.time, true); player.pauseVideo(); }
      setTimeout(() => { isRemoteAction = false; }, 800);
    });

    socket.on("drift_check", (data) => {
      if (isHost || !player || typeof player.getCurrentTime !== 'function') return;
      const localTime = player.getCurrentTime();
      const hostTime = data.time;
      const drift = Math.abs(localTime - hostTime);
      if (drift > 0.5) {
        isRemoteAction = true;
        player.seekTo(hostTime, true);
        if (data.is_playing) player.playVideo(); else player.pauseVideo();
        setTimeout(() => { isRemoteAction = false; }, 800);
      }
    });

    setInterval(() => {
      if (isHost && currentRoom && player && typeof player.getCurrentTime === 'function') {
        socket.emit("host_heartbeat", {
          room: currentRoom,
          time: player.getCurrentTime(),
          is_playing: (player.getPlayerState() === YT.PlayerState.PLAYING)
        });
      }
    }, 2000);

    loadVideoBtn.addEventListener("click", () => {
      const url = youtubeUrl.value.trim();
      let videoId = "";
      try {
        const parsed = new URL(url);
        if (["youtu.be", "www.youtu.be"].includes(parsed.hostname)) {
          videoId = parsed.pathname.slice(1).split("/")[0];
        } else if (["youtube.com", "www.youtube.com", "m.youtube.com"].includes(parsed.hostname)) {
          if (parsed.pathname === "/watch") videoId = parsed.searchParams.get("v") || "";
          else { const match = parsed.pathname.match(/^\/(embed|shorts)\/([^/]+)/); if (match) videoId = match[2]; }
        }
      } catch (e) { videoId = ""; }

      if (!/^[a-zA-Z0-9_-]{11}$/.test(videoId)) { videoMessage.textContent = "Please enter a valid YouTube video link."; return; }
      if (!currentRoom) { videoMessage.textContent = "Please create or join a room first!"; return; }

      socket.emit("change_video", { room: currentRoom, video_id: videoId });
      videoMessage.textContent = "Updating room video...";
    });

    // CHAT SYSTEM
    const chatInput = document.getElementById("chatInput");
    const sendChatBtn = document.getElementById("sendChatBtn");
    const chatMessages = document.getElementById("chatMessages");

    function sendChatMessage() {
      const msg = chatInput.value.trim();
      const customName = usernameInput.value.trim();
      const finalUsername = customName || (isHost ? "Host" : "Guest");
      if (msg && currentRoom) {
        socket.emit("send_chat", { room: currentRoom, message: msg, username: finalUsername });
        chatInput.value = "";
      }
    }

    sendChatBtn.addEventListener("click", sendChatMessage);
    chatInput.addEventListener("keypress", (e) => { if (e.key === "Enter") sendChatMessage(); });

    socket.on("chat_message", (data) => {
      const msgEl = document.createElement("div");
      msgEl.className = "bg-[#121212] p-2.5 rounded-xl border border-[#282828]";
      msgEl.innerHTML = `<span class="font-bold text-[#E50914]">${data.username}:</span> <span class="text-white">${data.message}</span>`;
      chatMessages.appendChild(msgEl);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    });

    // REACTION EMOJIS
    const reactionBtns = document.querySelectorAll(".reaction-btn");
    const emojiOverlay = document.getElementById("emojiOverlay");

    reactionBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        if (currentRoom) socket.emit("send_reaction", { room: currentRoom, emoji: btn.textContent });
      });
    });

    socket.on("floating_emoji", (data) => {
      const emojiEl = document.createElement("div");
      emojiEl.className = "emoji-float text-3xl";
      emojiEl.textContent = data.emoji;
      emojiEl.style.left = Math.random() * 80 + 10 + "%";
      emojiEl.style.bottom = "10px";
      emojiOverlay.appendChild(emojiEl);
      setTimeout(() => emojiEl.remove(), 2000);
    });

    // DYNAMIC LIVE YOUTUBE API SEARCH
    const searchMovieInput = document.getElementById("searchMovieInput");
    const apiSearchBtn = document.getElementById("apiSearchBtn");
    const movieGrid = document.getElementById("movieGrid");

    async function searchYouTubeAPI(query) {
      if (!query) return;
      movieGrid.innerHTML = `<p class="text-[#B3B3B3] text-xs col-span-3 text-center py-4">Searching YouTube...</p>`;

      if (YOUTUBE_API_KEY === "YOUR_API_KEY_HERE") {
        movieGrid.innerHTML = `<p class="text-[#E50914] text-xs col-span-3 text-center py-4">Please insert your YouTube API key into public/index.html!</p>`;
        return;
      }

      try {
        const response = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=6&q=${encodeURIComponent(query)}&type=video&key=${YOUTUBE_API_KEY}`);
        const data = await response.json();

        if (!data.items || data.items.length === 0) {
          movieGrid.innerHTML = `<p class="text-[#B3B3B3] text-xs col-span-3 text-center py-4">No results found on YouTube.</p>`;
          return;
        }

        movieGrid.innerHTML = "";
        data.items.forEach(item => {
          const videoId = item.id.videoId;
          const title = item.snippet.title;
          const channel = item.snippet.channelTitle;
          const poster = item.snippet.thumbnails.medium.url;

          const card = document.createElement("div");
          card.className = "group relative bg-[#121212] rounded-xl border border-[#282828] overflow-hidden cursor-pointer hover:border-[#E50914] transition-all text-xs";
          card.innerHTML = `
            <div class="aspect-video w-full overflow-hidden bg-[#121212]">
              <img src="${poster}" alt="${title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" />
            </div>
            <div class="p-2.5">
              <p class="font-bold text-white truncate">${title}</p>
              <p class="text-[10px] text-[#B3B3B3] mt-0.5">${channel}</p>
            </div>
          `;
          card.addEventListener("click", () => {
            if (currentRoom) {
              socket.emit("change_video", { room: currentRoom, video_id: videoId });
            } else {
              videoMessage.textContent = "Please create or join a room first!";
            }
          });
          movieGrid.appendChild(card);
        });

      } catch (err) {
        movieGrid.innerHTML = `<p class="text-[#E50914] text-xs col-span-3 text-center py-4">Error fetching YouTube search results.</p>`;
      }
    }

    apiSearchBtn.addEventListener("click", () => searchYouTubeAPI(searchMovieInput.value.trim()));
    searchMovieInput.addEventListener("keypress", (e) => { if (e.key === "Enter") searchYouTubeAPI(searchMovieInput.value.trim()); });
  </script>
</body>
</html>
